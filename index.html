<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN BOOSTER</title>
<style>
:root {
  --bg:#050b08; --green:#39ff78;
  --muted:#9cb8a5;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; padding:24px;
  display:grid; place-items:center;
  background:radial-gradient(ellipse at top,#102819,var(--bg) 60%);
  color:#e5ffeb; font:16px/1.5 Consolas,monospace;
}
main {
  width:min(760px,100%); padding:35px;
  border:1px solid #1a6737; border-radius:18px;
  background:#040d08; text-align:center;
}
h1,h2 { color:var(--green); }
p { color:var(--muted); }
.notice {
  border:1px solid #385a42; padding:18px;
  border-radius:12px; margin:24px 0;
}
button,.button {
  display:inline-block; padding:13px 18px;
  margin:6px; border:1px solid var(--green);
  border-radius:8px; background:var(--green);
  color:#041108; font:bold 14px Consolas,monospace;
  text-decoration:none; cursor:pointer;
}
.secondary { background:transparent; color:var(--green); }
.small { font-size:12px; }
#status { color:var(--green); min-height:24px; }
</style>
</head>
<body>
<main>
  <p>[ SYSTEM TOOL // VERSION 1.0 ]</p>
  <h1>GREEN BOOSTER</h1>
  <p>Неоновый «оптимизатор» для Windows 10/11.</p>
  <p>Режим: JUST FOR FUN • Система не изменяется.</p>

  <section class="notice">
    <h2>Журнал посещений</h2>
    <p>
      пр!
    </p>
    <button id="agree">Согласен, записать визит</button>
    <button id="decline" class="secondary">Продолжить без записи</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <h2>Готов проверить свой ПК?</h2>
  <p>Запусти шуточную анимацию ускорения.</p>

  <a class="button" href="https://github.com/fedorinovila052-dev/green-booster-site/releases/latest/download/GreenBooster.exe">
    ⬇ СКАЧАТЬ ПРОГРАММУ (.EXE)
  </a>

  <p class="small">GREEN BOOSTER • DEMO ONLY</p>
</main>

<script>
const WORKER_URL =
  "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

const status = document.getElementById("status");
const agree = document.getElementById("agree");
const decline = document.getElementById("decline");

agree.addEventListener("click", async () => {
  agree.disabled = true;
  decline.disabled = true;

  if (WORKER_URL.includes("YOUR-WORKER")) {
    status.textContent = "Сначала настрой сервер журнала.";
    return;
  }

  try {
    const response = await fetch(WORKER_URL + "/api/visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ consent: true })
    });

    if (!response.ok) throw new Error("Request failed");
    status.textContent = "Визит записан. ХА-ХА, попался! 😈";
  } catch {
    status.textContent = "Не удалось записать визит.";
  }
});

decline.addEventListener("click", () => {
  status.textContent = "Продолжаем без дополнительной записи.";
  agree.disabled = true;
  decline.disabled = true;
});
</script>
</body>
</html>
